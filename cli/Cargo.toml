[package]
name = "decap-pub-cli"
version = "0.1.0"
edition = "2021"
description = "CLI tool for publishing photos to Decap CMS"
license = "MIT"

[[bin]]
name = "decap-pub"
path = "src/main.rs"

[dependencies]
# Shared backend library
decap_pub = { path = "../backend" }

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }

# Config file handling
toml = "0.8"
directories = "5"

# Interactive prompts
dialoguer = "0.11"

# Progress indication
indicatif = "0.17"

# Colored terminal output
colored = "2"
