[package]
name = "decap-pub-gui"
version = "0.1.0"
edition = "2021"
description = "Linux GUI for publishing photos to Decap CMS"
license = "MIT"

[[bin]]
name = "decap-pub-gui"
path = "src/main.rs"

[dependencies]
# Shared backend library
decap_pub = { path = "../backend" }

# GUI framework - iced is pure Rust, cross-platform
iced = { version = "0.13", features = ["image", "tokio"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }

# Config file handling
toml = "0.8"
directories = "5"
serde = { version = "1", features = ["derive"] }

# Image handling
image = "0.25"

# File system watching (for auto-refresh)
notify = "7"

# Native file dialogs
rfd = "0.15"

# Walkdir for recursive directory traversal
walkdir = "2"
